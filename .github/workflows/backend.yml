# Проверки backend на каждый push в main и pull request: ruff и pytest на Windows,
# Linux и macOS. Отдельный прогон на Linux с эмулятором shell (SYNEX_TEST_SHELL=emulated)
# проверяет тот же путь, по которому тесты команд идут на Windows. Интеграционные тесты
# (полный цикл UI → FastAPI → synex_worker → SSH-сервер) идут на Linux: synex_worker
# для Linux из репозитория и локальный sshd, который тесты поднимают сами.
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: test (${{ matrix.os }}${{ matrix.shell && ', emulated shell' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            shell: emulated
          - os: windows-latest
          - os: macos-latest
    env:
      SYNEX_TEST_SHELL: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m "not integration" -ra

  integration:
    name: integration (Linux, real worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
      - run: uv sync --locked
      - run: uv run pytest -m integration -ra
