name: Rust

on:
  push:
    branches: [ "core", "core/**", "core-ipc-worker" ]
  pull_request:
    branches: [ "core", "core/**" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --release
      working-directory: ./core
    - name: Run tests
      run: cargo test --verbose
      working-directory: ./core
