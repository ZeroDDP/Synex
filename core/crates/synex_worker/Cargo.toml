[package]
name = "synex_worker"
version = "0.1.0"
edition = "2024"

[dependencies]
synex_core = { path = "../synex_core" }

tokio = { version = "1", features = [
    "full",
    "net",
    "io-util",
    "rt-multi-thread",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
rmp-serde = "1.3.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# env_logger = "0.11"
# log = "0.4"
