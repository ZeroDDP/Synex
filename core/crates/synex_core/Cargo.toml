[package]
name = "synex_core"
version = "0.1.0"
edition = "2024"

[dependencies]
russh = "0.65"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
bollard = { version = "0.21", default-features = false, features = ["http"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = "0.3"

thiserror = "1"
russh-sftp = "3.0.1"
pageant = "0.2.5"
