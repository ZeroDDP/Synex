[project]
name = "synex"
version = "0.3.0"
description = "Synex backend: FastAPI-слой между Rust-ядром synex_worker и UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "msgpack>=1.1.0",
    "structlog>=24.4.0",
    "cryptography>=43.0.0",
    "bcrypt>=4.2.0",
    "keyring>=25.5.0",
    "pywin32>=308; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: полный цикл UI → FastAPI → synex_worker → SSH-сервер (tests/integration)",
]
